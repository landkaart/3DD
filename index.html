<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PDOK adresselectie</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: system-ui, sans-serif;
  background: #111;
  color: #eee;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 7px;
}

button {
  margin-top: 10px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: bold;
  border: 0;
  border-radius: 7px;
}

#status {
  margin-top: 15px;
}

.resultaat {
  margin-top: 10px;
  padding: 14px;
  background: #222;
  border-radius: 8px;
  cursor: pointer;
}

.resultaat:active {
  background: #444;
}

.adres {
  font-size: 16px;
  font-weight: bold;
}

.details {
  margin-top: 6px;
  color: #aaa;
  font-size: 12px;
}
</style>
</head>

<body>

<h2>🇳🇱 PDOK adresselectie</h2>

<input
  id="adres"
  value="Stationsweg 1, Leeuwarden"
>

<button id="zoek">
ZOEK ADRES
</button>

<div id="status">
Nog niet gezocht.
</div>

<div id="resultaten"></div>


<script>

const adres =
document.getElementById("adres");

const zoek =
document.getElementById("zoek");

const status =
document.getElementById("status");

const resultaten =
document.getElementById("resultaten");


zoek.onclick =
async function () {

  resultaten.innerHTML = "";

  status.textContent =
    "PDOK zoeken…";

  try {

    const url =
      "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free" +
      "?q=" +
      encodeURIComponent(
        adres.value.trim()
      ) +
      "&fq=type:adres" +
      "&rows=10";


    const response =
      await fetch(url);


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );
    }


    const json =
      JSON.parse(text);


    const docs =
      json.response?.docs || [];


    status.textContent =
      docs.length +
      " resultaten gevonden.";


    docs.forEach(
      function (d, index) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "resultaat";


        div.innerHTML =

          '<div class="adres">' +
          escapeHtml(
            d.weergavenaam ||
            "Onbekend adres"
          ) +
          '</div>' +

          '<div class="details">' +
          'huisnummer: ' +
          escapeHtml(
            d.huisnummer
          ) +
          ' · huisletter: ' +
          escapeHtml(
            d.huisletter ||
            "-"
          ) +
          ' · toevoeging: ' +
          escapeHtml(
            d.huisnummertoevoeging ||
            "-"
          ) +
          '<br>' +
          'BAG object: ' +
          escapeHtml(
            d.adresseerbaarobject_id ||
            "-"
          ) +
          '</div>';


        div.onclick =
          function () {

            status.innerHTML =
              "<b>Gekozen:</b><br>" +
              escapeHtml(
                d.weergavenaam
              ) +
              "<br><br>" +
              "<b>Verblijfsobject:</b> " +
              escapeHtml(
                d.adresseerbaarobject_id
              ) +
              "<br><br>" +
              "Coördinaten:<br>" +
              escapeHtml(
                d.centroide_ll
              );

            /*
             * Alles staat ook in de console,
             * zodat we later exact dezelfde
             * gegevens kunnen gebruiken.
             */

            console.log(
              "GEKOZEN PDOK ADRES",
              d
            );
          };


        resultaten.appendChild(
          div
        );
      }
    );


    if (!docs.length) {

      status.textContent =
        "Geen adressen gevonden.";
    }


  } catch (error) {

    status.textContent =
      "FOUT: " +
      error.message;
  }
};


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}

</script>

</body>
</html>
