<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>3DBAG diagnose</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: system-ui, sans-serif;
  background: #111;
  color: #eee;
}

h1 {
  font-size: 20px;
}

input {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 7px;
  font-size: 16px;
}

button {
  margin-top: 10px;
  padding: 12px 18px;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
}

.step {
  margin-top: 12px;
  padding: 12px;
  background: #202020;
  border-radius: 8px;
}

.ok {
  border-left: 5px solid #4caf50;
}

.bad {
  border-left: 5px solid #f44336;
}

.wait {
  border-left: 5px solid #aaa;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
  color: #ccc;
}
</style>
</head>

<body>

<h1>🇳🇱 3DBAG diagnose</h1>

<input
  id="address"
  value="Stationsweg 1, Leeuwarden"
>

<button id="go">
TEST
</button>

<div id="steps"></div>


<script>

const steps =
document.getElementById("steps");

const address =
document.getElementById("address");

const go =
document.getElementById("go");


function addStep(
  title,
  state,
  text = ""
) {

  const div =
    document.createElement("div");

  div.className =
    "step " + state;

  div.innerHTML =
    "<b>" +
    title +
    "</b>" +
    (
      text
        ? "<pre>" +
          escapeHtml(text) +
          "</pre>"
        : ""
    );

  steps.appendChild(div);

  return div;
}


function escapeHtml(
  text
) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}


async function request(
  url
) {

  const response =
    await fetch(url);

  const text =
    await response.text();

  return {
    status:
      response.status,

    ok:
      response.ok,

    text
  };
}


async function run() {

  steps.innerHTML = "";

  go.disabled = true;


  try {

    /* =====================================================
       1 — PDOK
    ===================================================== */

    let box =
      addStep(
        "1. PDOK adres",
        "wait"
      );


    const q =
      address.value.trim();


    const pdokUrl =
      "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free" +
      "?q=" +
      encodeURIComponent(q) +
      "&fq=type:adres" +
      "&rows=1";


    try {

      const result =
        await request(
          pdokUrl
        );


      if (!result.ok) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>1. PDOK adres — FOUT</b>" +
          "<pre>" +
          escapeHtml(
            "HTTP " +
            result.status +
            "\n\n" +
            result.text
          ) +
          "</pre>";

        return;
      }


      const json =
        JSON.parse(
          result.text
        );


      const doc =
        json.response?.docs?.[0];


      if (!doc) {

        throw new Error(
          "Geen adres gevonden"
        );
      }


      const point =
        String(
          doc.centroide_ll || ""
        );


      const match =
        point.match(
          /^POINT\s*\(\s*([+-]?\d+(?:\.\d+)?)\s+([+-]?\d+(?:\.\d+)?)\s*\)$/i
        );


      if (!match) {

        throw new Error(
          "Geen bruikbare centroide_ll"
        );
      }


      const lon =
        Number(match[1]);

      const lat =
        Number(match[2]);


      box.className =
        "step ok";

      box.innerHTML =
        "<b>1. PDOK adres — OK</b>" +
        "<pre>" +
        escapeHtml(
          JSON.stringify(
            {
              adres:
                doc.weergavenaam,

              longitude:
                lon,

              latitude:
                lat
            },
            null,
            2
          )
        ) +
        "</pre>";


      /* =================================================
         2 — BAG VERBLIJFSOBJECT
      ================================================= */

      box =
        addStep(
          "2. BAG verblijfsobject",
          "wait"
        );


      const delta =
        0.0002;


      const bbox =
        [
          lon - delta,
          lat - delta,
          lon + delta,
          lat + delta
        ].join(",");


      const bagVoUrl =
        "https://api.pdok.nl/kadaster/bag/ogc/v2" +
        "/collections/verblijfsobject/items" +
        "?bbox=" +
        encodeURIComponent(bbox) +
        "&limit=100" +
        "&f=json";


      const voResult =
        await request(
          bagVoUrl
        );


      if (!voResult.ok) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>2. BAG verblijfsobject — FOUT</b>" +
          "<pre>" +
          escapeHtml(
            "URL:\n" +
            bagVoUrl +
            "\n\nHTTP " +
            voResult.status +
            "\n\n" +
            voResult.text
          ) +
          "</pre>";

        return;
      }


      const voJson =
        JSON.parse(
          voResult.text
        );


      const feature =
        voJson.features?.[0];


      if (!feature) {

        throw new Error(
          "Geen BAG-resultaat"
        );
      }


      const props =
        feature.properties || {};


      box.className =
        "step ok";

      box.innerHTML =
        "<b>2. BAG verblijfsobject — OK</b>" +
        "<pre>" +
        escapeHtml(
          JSON.stringify(
            {
              identificatie:
                props.identificatie,

              adres:
                (
                  props.openbare_ruimte_naam ||
                  ""
                ) +
                " " +
                (
                  props.huisnummer ||
                  ""
                ) +
                (
                  props.huisletter ||
                  ""
                ) +
                " " +
                (
                  props.toevoeging ||
                  ""
                ),

              postcode:
                props.postcode,

              "pand.href":
                props["pand.href"]
            },
            null,
            2
          )
        ) +
        "</pre>";


      /* =================================================
         3 — BAG PAND
      ================================================= */

      box =
        addStep(
          "3. BAG pand",
          "wait"
        );


      const hrefs =
        props["pand.href"];


      if (
        !Array.isArray(hrefs) ||
        !hrefs.length
      ) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>3. BAG pand — GEEN RELATIE</b>" +
          "<pre>" +
          escapeHtml(
            JSON.stringify(
              props,
              null,
              2
            )
          ) +
          "</pre>";

        return;
      }


      const pandUrl =
        hrefs[0];


      const pandResult =
        await request(
          pandUrl
        );


      if (!pandResult.ok) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>3. BAG pand — FOUT</b>" +
          "<pre>" +
          escapeHtml(
            "URL:\n" +
            pandUrl +
            "\n\nHTTP " +
            pandResult.status +
            "\n\n" +
            pandResult.text
          ) +
          "</pre>";

        return;
      }


      const pand =
        JSON.parse(
          pandResult.text
        );


      const pandProps =
        pand.properties || {};


      const pandId =
        pandProps.identificatie;


      box.className =
        "step ok";

      box.innerHTML =
        "<b>3. BAG pand — OK</b>" +
        "<pre>" +
        escapeHtml(
          JSON.stringify(
            {
              identificatie:
                pandId,

              bouwjaar:
                pandProps.bouwjaar,

              bronhouder:
                pandProps.bronhouder_naam
            },
            null,
            2
          )
        ) +
        "</pre>";


      /* =================================================
         4 — 3DBAG INDIVIDUEEL
      ================================================= */

      box =
        addStep(
          "4. 3DBAG individueel pand",
          "wait"
        );


      const threeId =
        "NL.IMBAG.Pand." +
        String(pandId)
          .replace(
            /^NL\.IMBAG\.Pand\./i,
            ""
          );


      const threeUrl =
        "https://api.3dbag.nl" +
        "/collections/pand/items/" +
        encodeURIComponent(
          threeId
        );


      const threeResult =
        await request(
          threeUrl
        );


      if (!threeResult.ok) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>4. 3DBAG individueel — FOUT</b>" +
          "<pre>" +
          escapeHtml(
            "ID:\n" +
            threeId +
            "\n\nURL:\n" +
            threeUrl +
            "\n\nHTTP " +
            threeResult.status +
            "\n\n" +
            threeResult.text
          ) +
          "</pre>";

      } else {

        box.className =
          "step ok";

        box.innerHTML =
          "<b>4. 3DBAG individueel — OK</b>" +
          "<pre>" +
          escapeHtml(
            threeResult.text
              .substring(
                0,
                3000
              )
          ) +
          "</pre>";
      }


      /* =================================================
         5 — 3DBAG BBOX
      ================================================= */

      box =
        addStep(
          "5. 3DBAG bbox",
          "wait"
        );


      const threeBBox =
        [
          lon - 0.00015,
          lat - 0.00015,
          lon + 0.00015,
          lat + 0.00015
        ].join(",");


      const bboxUrl =
        "https://api.3dbag.nl" +
        "/collections/pand/items" +
        "?bbox=" +
        encodeURIComponent(
          threeBBox
        ) +
        "&limit=10";


      const bboxResult =
        await request(
          bboxUrl
        );


      if (!bboxResult.ok) {

        box.className =
          "step bad";

        box.innerHTML =
          "<b>5. 3DBAG bbox — FOUT</b>" +
          "<pre>" +
          escapeHtml(
            "URL:\n" +
            bboxUrl +
            "\n\nHTTP " +
            bboxResult.status +
            "\n\n" +
            bboxResult.text
          ) +
          "</pre>";

      } else {

        box.className =
          "step ok";

        box.innerHTML =
          "<b>5. 3DBAG bbox — OK</b>" +
          "<pre>" +
          escapeHtml(
            bboxResult.text
              .substring(
                0,
                3000
              )
          ) +
          "</pre>";
      }


  } catch (error) {

    addStep(
      "ONVERWACHTE JAVASCRIPT-FOUT",
      "bad",
      error.stack ||
      error.message ||
      String(error)
    );

  } finally {

    go.disabled =
      false;
  }
}


go.addEventListener(
  "click",
  run
);

</script>

</body>
</html>
